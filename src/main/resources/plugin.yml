name: ElyonaCore
version: 1.0.0
main: world.elyona.core.ElyonaCorePlugin
api-version: "1.21"
authors: [Elyona World]
depend: [Vault, LuckPerms]

permissions:
  elyona.admin:
    description: ElyonaCore の管理者権限
    default: op

commands:
  balance:
    description: 所持Credを確認する
    usage: /balance
    aliases: [bal]
  pay:
    description: 他のプレイヤーにCredを送金する（5%税）
    usage: /pay <player> <amount>
  eco:
    description: 残高を管理する（管理者用）
    usage: /eco <give|take|set> <player> <amount>
    permission: elyona.admin
  rank:
    description: ランク・経験値を確認する
    usage: /rank [player]
  season:
    description: シーズンを管理する（管理者用）
    usage: /season <start <name>|end>
    permission: elyona.admin
  title:
    description: 称号を管理する
    usage: /title [set <id>|clear|grant <player> <id>]
